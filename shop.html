<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito - ShoeStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- HEADER -->
  <header class="header">
    <button class="header__menu-btn" id="openMenu" aria-label="Abrir menú">☰</button>
    <span class="header__title">ShoeStore</span>
    <a href="shop.html" class="cart-icon" aria-label="Ver carrito">
      🛒<span class="cart-icon__count" id="cartCount">0</span>
    </a>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Menú de navegación">
    <button class="sidebar__close" id="closeMenu" aria-label="Cerrar menú">✖</button>
    <nav>
      <a href="index.html" class="sidebar__link">Inicio</a>
      <a href="form.html"  class="sidebar__link">Cuenta</a>
      <a href="shop.html"  class="sidebar__link sidebar__link--active">Carrito</a>
    </nav>
  </aside>

  <!-- MAIN: Carrito -->
  <main>
    <section class="cart" aria-label="Tu carrito de compras">
      <h1 class="cart__title">Tu carrito</h1>

      <!-- Lista de productos se genera con JS -->
      <ul class="cart__list" id="cartItems"></ul>

      <p class="cart__total">Total: $<span id="total">0</span></p>

      <div class="cart__actions">
        <button class="cart__btn cart__btn--buy"   id="buy">Finalizar compra</button>
        <button class="cart__btn cart__btn--clear" id="clear">Vaciar carrito</button>
      </div>
    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
