<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cuenta - ShoeStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- HEADER -->
  <header class="header">
    <button class="header__menu-btn" id="openMenu" aria-label="Abrir menú">☰</button>
    <span class="header__title">ShoeStore</span>
    <a href="shop.html" class="cart-icon" aria-label="Ver carrito">
      🛒<span class="cart-icon__count" id="cartCount">0</span>
    </a>
  </header>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar" aria-label="Menú de navegación">
    <button class="sidebar__close" id="closeMenu" aria-label="Cerrar menú">✖</button>
    <nav>
      <a href="index.html" class="sidebar__link">Inicio</a>
      <a href="form.html"  class="sidebar__link sidebar__link--active">Cuenta</a>
      <a href="shop.html"  class="sidebar__link">Carrito</a>
    </nav>
  </aside>

  <!-- MAIN: Formulario -->
  <main class="form-container">
    <form class="register-form" id="registerForm" novalidate>
      <h1 class="register-form__title">Crear cuenta</h1>

      <div class="register-form__group">
        <label class="register-form__label" for="nombre">Nombre</label>
        <input
          class="register-form__input"
          type="text"
          id="nombre"
          placeholder="Tu nombre completo"
          required
        >
      </div>

      <div class="register-form__group">
        <label class="register-form__label" for="correo">Correo electrónico</label>
        <input
          class="register-form__input"
          type="email"
          id="correo"
          placeholder="ejemplo@correo.com"
          required
        >
      </div>

      <div class="register-form__group">
        <label class="register-form__label" for="password">Contraseña</label>
        <input
          class="register-form__input"
          type="password"
          id="password"
          placeholder="Mínimo 6 caracteres"
          required
          minlength="6"
        >
      </div>

      <button type="submit" class="register-form__btn">Registrarse</button>

      <!-- Mensaje de feedback -->
      <p class="register-form__message" id="formMessage" role="alert"></p>
    </form>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
